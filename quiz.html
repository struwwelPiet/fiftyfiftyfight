<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Steinquiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  /* ======================================================================
     STEINQUIZ — Fragen bearbeiten: siehe QUIZ_DATA weiter unten im <script>.
     Steuerung während der Präsentation:
       →      weiter (Frage -> auflösen -> nächste Frage)
       ←      eine Frage zurück
       Home   zurück zum Startbildschirm
       F      Vollbild an/aus
     ====================================================================== */

  :root{
    --bg-0:#080a0e;
    --bg-1:#0f131a;
    --panel:#141922;
    --panel-hi:#1b212c;
    --line:#262e3b;
    --ink:#f2efe6;
    --ink-dim:#9aa3b2;
    --amber:#f0b429;
    --amber-dim:#7a5c1d;
    --green:#3ddc84;
    --green-dim:#173324;
    --red:#ef4444;
    --red-dim:#3a1a1a;
    --display:'Big Shoulders Display',sans-serif;
    --body:'Space Grotesk',sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    width:100%; height:100%;
    background:var(--bg-0);
    color:var(--ink);
    font-family:var(--body);
    overflow:hidden;
  }

  body{
    position:relative;
  }

  /* ambient background: slow, soft moving light — subtle, non-distracting */
  .ambient{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(circle at 18% 20%, rgba(240,180,41,0.09), transparent 40%),
      radial-gradient(circle at 82% 78%, rgba(61,220,132,0.06), transparent 42%),
      radial-gradient(circle at 50% 50%, var(--bg-1), var(--bg-0) 70%);
    animation: driftBg 26s ease-in-out infinite alternate;
  }
  @keyframes driftBg{
    0%{ background-position: 0 0, 0 0, center; }
    100%{ background-position: 4% 3%, -3% -4%, center; }
  }
  .vignette{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    box-shadow: inset 0 0 18vw 2vw rgba(0,0,0,0.75);
  }

  .stage{
    position:relative; z-index:2;
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
  }

  .screen{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0; visibility:hidden;
    transition:opacity .5s ease;
  }
  .screen.active{ opacity:1; visibility:visible; }

  /* ---------- Start ---------- */
  #start{ flex-direction:column; text-align:center; padding:4vh 6vw; }
  .kicker{
    font-family:var(--display);
    font-weight:700;
    letter-spacing:.08em;
    color:var(--amber-dim);
    font-size:clamp(1rem,1.6vw,1.4rem);
    margin-bottom:1vh;
  }
  #start h1{
    font-family:var(--display);
    font-weight:800;
    font-size:clamp(3.5rem,11vw,9rem);
    line-height:.92;
    color:var(--ink);
    text-shadow:0 0 60px rgba(240,180,41,0.15);
  }
  #start .stones{
    display:flex; gap:2vw; margin:4vh 0 3vh;
  }
  .stone-icon{
    width:clamp(20px,2.4vw,32px); height:clamp(20px,2.4vw,32px);
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fce6ab, var(--amber) 55%, #8a640f 100%);
    box-shadow:0 0 22px rgba(240,180,41,0.5);
    animation: floatStone 3.2s ease-in-out infinite;
  }
  .stone-icon:nth-child(2){ animation-delay:.5s; }
  .stone-icon:nth-child(3){ animation-delay:1s; }
  @keyframes floatStone{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-10px); }
  }
  #start p{
    font-size:clamp(1rem,1.6vw,1.35rem);
    color:var(--ink-dim);
    max-width:44ch;
  }
  .hint{
    margin-top:5vh;
    font-family:var(--display);
    font-weight:700;
    letter-spacing:.04em;
    color:var(--amber);
    font-size:clamp(1rem,1.5vw,1.3rem);
    animation:pulseHint 1.8s ease-in-out infinite;
  }
  @keyframes pulseHint{
    0%,100%{ opacity:.55; }
    50%{ opacity:1; }
  }

  /* ---------- Quiz ---------- */
  #quiz{ flex-direction:column; padding:5vh 6vw 6vh; }

  .quiz-inner{
    width:100%; max-width:1400px;
    display:flex; flex-direction:column; align-items:center;
    gap:5vh;
  }

  .counter{
    position:absolute; top:4vh; right:5vw;
    font-family:var(--display);
    font-weight:700;
    font-size:clamp(1.1rem,1.8vw,1.7rem);
    color:var(--ink-dim);
    letter-spacing:.03em;
    font-variant-numeric: tabular-nums;
  }
  .counter b{ color:var(--ink); }

  .question-wrap{
    width:100%;
    text-align:center;
    min-height:14vh;
    display:flex; align-items:center; justify-content:center;
  }
  #question-text{
    font-size:clamp(2rem,4.6vw,4.4rem);
    font-weight:600;
    line-height:1.15;
    max-width:26ch;
    opacity:0; transform:translateY(14px);
  }
  #question-text.in{
    animation: qIn .55s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes qIn{
    to{ opacity:1; transform:translateY(0); }
  }

  .answers-row{
    position:relative;
    width:100%;
    display:flex;
    align-items:stretch;
    justify-content:center;
    gap:6vw;
  }

  .answer{
    flex:1; max-width:560px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:5vh 3vw;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2vh;
    min-height:24vh;
    opacity:0; transform:translateY(18px);
    transition: border-color .5s ease, background .5s ease, box-shadow .5s ease, opacity .5s ease, transform .5s ease, filter .5s ease;
  }
  .answer.in{ opacity:1; transform:translateY(0); }
  .answer.in.left{ transition-delay:.08s; }
  .answer.in.right{ transition-delay:.18s; }

  .answer-side{
    font-family:var(--display);
    font-weight:700;
    letter-spacing:.06em;
    font-size:clamp(.85rem,1.1vw,1.1rem);
    color:var(--ink-dim);
  }
  .answer-text{
    font-size:clamp(1.6rem,3.2vw,3rem);
    font-weight:500;
    text-align:center;
    line-height:1.2;
  }

  .answer.correct{
    border-color:var(--green);
    background: linear-gradient(180deg, var(--panel-hi), var(--green-dim) 220%);
    box-shadow:0 0 60px rgba(61,220,132,0.18), inset 0 0 0 1px rgba(61,220,132,0.25);
  }
  .answer.wrong{
    filter:saturate(.4) brightness(.72);
    border-color:var(--line);
  }

  .verdict{
    font-family:var(--display);
    font-weight:800;
    letter-spacing:.05em;
    font-size:clamp(1.3rem,2.4vw,2.1rem);
    display:flex; align-items:center; gap:.6em;
    opacity:0; transform:scale(.85);
  }
  .verdict.show{
    animation: verdictIn .45s cubic-bezier(.2,.9,.3,1.2) forwards;
  }
  @keyframes verdictIn{
    to{ opacity:1; transform:scale(1); }
  }
  .verdict.ok{ color:var(--green); }
  .verdict.no{ color:#c25a5a; }

  .verdict svg{ width:1.1em; height:1.1em; overflow:visible; }
  .verdict.ok svg path{
    stroke:var(--green);
    stroke-width:3;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:40;
    stroke-dashoffset:40;
  }
  .verdict.ok.show svg path{
    animation: draw .4s ease .15s forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  .verdict.no svg line{
    stroke:#c25a5a;
    stroke-width:3;
    stroke-linecap:round;
  }

  /* the stone that settles toward the right answer */
  .stone-marker{
    position:absolute;
    top:-2.6vh;
    left:50%;
    width:clamp(26px,2.6vw,38px);
    height:clamp(26px,2.6vw,38px);
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fce6ab, var(--amber) 55%, #8a640f 100%);
    box-shadow:0 0 26px rgba(240,180,41,0.55);
    transform:translate(-50%,0);
    transition: transform .9s cubic-bezier(.34,1.4,.4,1), box-shadow .6s ease;
    animation: floatStone 3.2s ease-in-out infinite;
  }
  .stone-marker.revealed{
    animation:none;
    box-shadow:0 0 34px rgba(61,220,132,0.6);
  }
  .stone-marker.to-left{ transform:translate(calc(-50% - 27vw), 0); }
  .stone-marker.to-right{ transform:translate(calc(-50% + 27vw), 0); }

  /* ---------- End ---------- */
  #end{ flex-direction:column; text-align:center; }
  #end h1{
    font-family:var(--display);
    font-weight:800;
    font-size:clamp(3rem,8vw,6.5rem);
    color:var(--ink);
  }
  #end p{
    margin-top:2vh;
    color:var(--ink-dim);
    font-size:clamp(1rem,1.6vw,1.3rem);
  }

  .legend{
    position:fixed;
    bottom:2.2vh; left:2.4vw;
    z-index:5;
    font-size:.78rem;
    color:var(--ink-dim);
    opacity:.32;
    letter-spacing:.02em;
    font-family:var(--body);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="ambient"></div>
<div class="vignette"></div>

<div class="stage">

  <div id="start" class="screen active">
    <div class="kicker" id="quiz-kicker">Livequiz</div>
    <h1 id="quiz-title">Steinquiz</h1>
    <div class="stones">
      <div class="stone-icon"></div>
      <div class="stone-icon"></div>
      <div class="stone-icon"></div>
    </div>
    <p>Nimm bei jeder Frage einen Stein in die linke oder rechte Hand — je nachdem, welche Antwort du für richtig hältst.</p>
    <div class="hint">Drücke → um zu starten</div>
  </div>

  <div id="quiz" class="screen">
    <div class="counter"><b id="qnum">01</b> / <span id="qtotal">10</span></div>
    <div class="quiz-inner">
      <div class="question-wrap">
        <div id="question-text"></div>
      </div>
      <div class="answers-row">
        <div class="answer left" id="answer-left">
          <div class="answer-side">Linke Hand</div>
          <div class="answer-text" id="answer-left-text"></div>
          <div class="verdict" id="verdict-left"></div>
        </div>
        <div class="stone-marker" id="stone"></div>
        <div class="answer right" id="answer-right">
          <div class="answer-side">Rechte Hand</div>
          <div class="answer-text" id="answer-right-text"></div>
          <div class="verdict" id="verdict-right"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="end" class="screen">
    <h1>Quiz beendet</h1>
    <p>Danke fürs Mitspielen.</p>
  </div>

</div>

<div class="legend">→ weiter · ← zurück · Home Start · F Vollbild</div>

<script>

  /* ==========================================================
     QUIZ-DATEN
     Passe Titel und Fragen hier an. Jede Frage braucht:
       question : Fragetext
       answers  : [linke Antwort, rechte Antwort]
       correct  : 0 (links) oder 1 (rechts)
     ========================================================== */

  const QUIZ_META = {
    title: "Steinquiz",
    kicker: "Livequiz"
  };

  const QUIZ_DATA = [
    { question: "Welches Tier hat mehr Beine?", answers: ["Spinne", "Ameise"], correct: 0 },
    { question: "Was ist größer?", answers: ["Der Mond", "Die Sonne"], correct: 1 },
    { question: "Was wurde zuerst erfunden?", answers: ["Das Rad", "Die Schrift"], correct: 0 },
    { question: "Welches Land hat mehr Einwohner?", answers: ["Deutschland", "Frankreich"], correct: 0 },
    { question: "Was ist schwerer?", answers: ["1 kg Federn", "1 kg Eisen"], correct: 0 },
    { question: "Welcher Ozean ist größer?", answers: ["Atlantik", "Pazifik"], correct: 1 },
    { question: "Was kam zuerst?", answers: ["Dinosaurier", "Menschen"], correct: 0 },
    { question: "Welcher Fluss ist länger?", answers: ["Rhein", "Donau"], correct: 1 }
  ];

  document.getElementById("quiz-title").textContent = QUIZ_META.title;
  document.getElementById("quiz-kicker").textContent = QUIZ_META.kicker;
  document.getElementById("qtotal").textContent = String(QUIZ_DATA.length).padStart(2,"0");

  const screens = {
    start: document.getElementById("start"),
    quiz: document.getElementById("quiz"),
    end: document.getElementById("end")
  };

  let index = 0;
  let revealed = false;
  let started = false;
  let finished = false;

  function showScreen(name){
    Object.values(screens).forEach(s => s.classList.remove("active"));
    screens[name].classList.add("active");
  }

  const qNumEl = document.getElementById("qnum");
  const qTextEl = document.getElementById("question-text");
  const ansLeft = document.getElementById("answer-left");
  const ansRight = document.getElementById("answer-right");
  const ansLeftText = document.getElementById("answer-left-text");
  const ansRightText = document.getElementById("answer-right-text");
  const verdictLeft = document.getElementById("verdict-left");
  const verdictRight = document.getElementById("verdict-right");
  const stone = document.getElementById("stone");

  const checkSvg = '<svg viewBox="0 0 20 20"><path d="M3 10.5 L8 15 L17 4"/></svg>';
  const crossSvg = '<svg viewBox="0 0 20 20"><line x1="4" y1="4" x2="16" y2="16"/><line x1="16" y1="4" x2="4" y2="16"/></svg>';

  function renderQuestion(){
    const q = QUIZ_DATA[index];
    revealed = false;

    qNumEl.textContent = String(index+1).padStart(2,"0");
    qTextEl.textContent = q.question;
    ansLeftText.textContent = q.answers[0];
    ansRightText.textContent = q.answers[1];

    verdictLeft.className = "verdict";
    verdictRight.className = "verdict";
    verdictLeft.innerHTML = "";
    verdictRight.innerHTML = "";

    ansLeft.classList.remove("in","correct","wrong");
    ansRight.classList.remove("in","correct","wrong");
    qTextEl.classList.remove("in");
    stone.classList.remove("to-left","to-right","revealed");
    stone.style.top = "";

    // restart entrance animations
    void qTextEl.offsetWidth;
    qTextEl.classList.add("in");

    requestAnimationFrame(() => {
      ansLeft.classList.add("in","left");
      ansRight.classList.add("in","right");
    });
  }

  function revealAnswer(){
    revealed = true;
    const q = QUIZ_DATA[index];
    const correctEl = q.correct === 0 ? ansLeft : ansRight;
    const wrongEl = q.correct === 0 ? ansRight : ansLeft;
    const correctVerdict = q.correct === 0 ? verdictLeft : verdictRight;
    const wrongVerdict = q.correct === 0 ? verdictRight : verdictLeft;

    correctEl.classList.add("correct");
    wrongEl.classList.add("wrong");

    stone.classList.add(q.correct === 0 ? "to-left" : "to-right");
    setTimeout(() => stone.classList.add("revealed"), 700);

    correctVerdict.classList.add("ok");
    correctVerdict.innerHTML = checkSvg + "Richtig";
    wrongVerdict.classList.add("no");
    wrongVerdict.innerHTML = crossSvg + "Falsch";

    requestAnimationFrame(() => {
      correctVerdict.classList.add("show");
      wrongVerdict.classList.add("show");
    });
  }

  function startQuiz(){
    started = true;
    finished = false;
    index = 0;
    showScreen("quiz");
    renderQuestion();
  }

  function advance(){
    if(!revealed){
      revealAnswer();
      return;
    }
    if(index < QUIZ_DATA.length - 1){
      index++;
      renderQuestion();
    } else {
      finished = true;
      showScreen("end");
    }
  }

  function goBack(){
    if(!started) return;
    if(finished){
      finished = false;
      showScreen("quiz");
      renderQuestion();
      return;
    }
    if(index > 0){
      index--;
      renderQuestion();
    }
  }

  function toggleFullscreen(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen().catch(()=>{});
    }
  }

  window.addEventListener("keydown", (e) => {
    if(e.key === "ArrowRight" || e.key === " "){
      e.preventDefault();
      if(!started){ startQuiz(); }
      else if(!finished){ advance(); }
    } else if(e.key === "ArrowLeft"){
      e.preventDefault();
      goBack();
    } else if(e.key === "Home"){
      e.preventDefault();
      started = false;
      finished = false;
      showScreen("start");
    } else if(e.key.toLowerCase() === "f"){
      e.preventDefault();
      toggleFullscreen();
    }
  });

  document.addEventListener("click", () => {
    if(!started){ startQuiz(); }
  }, { once:false });

</script>
</body>
</html>
